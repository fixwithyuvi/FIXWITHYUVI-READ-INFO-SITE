<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>FIXWITHYUVI - Android ToolKit</title>
<style>
:root{--bg:#0b0e13;--card:#141922;--card2:#1b2230;--text:#eef1f6;--muted:#8793a5;--line:#252d3b;--accent:#ff6900;--accent2:#ff9a3d;--ok:#34d27b;--bad:#ff5a52}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
background:radial-gradient(520px 320px at 85% -60px,rgba(255,105,0,.22),transparent 70%),radial-gradient(420px 300px at -10% 120px,rgba(255,154,61,.10),transparent 70%),var(--bg);
padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px 0}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff;box-shadow:0 6px 20px rgba(255,105,0,.35)}
.ttl{flex:1;min-width:0}
h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.3px}
h1 span{color:var(--accent)}
.ttl small{color:var(--muted);font-size:12px}
.pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--muted);white-space:nowrap}
.pill:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad)}
.pill.on{color:var(--ok);border-color:rgba(52,210,123,.4)}
.pill.on:before{background:var(--ok);box-shadow:0 0 0 0 rgba(52,210,123,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(52,210,123,0)}100%{box-shadow:0 0 0 0 rgba(52,210,123,0)}}
.card{background:linear-gradient(180deg,var(--card),#10151d);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:14px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1}
button{font:inherit;color:var(--text);border:0;background:transparent;cursor:pointer;transition:transform .12s,opacity .2s,background .2s}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.35;cursor:not-allowed}
button.tab{padding:11px 4px;border-radius:11px;font-weight:700;font-size:13px;color:var(--muted)}
button.tab.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 14px rgba(255,105,0,.35)}
.sub-tabs{display:flex;gap:8px;margin-top:10px}
button.subtab{flex:1;padding:10px 6px;border-radius:12px;font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line);background:var(--card2)}
button.subtab.on{color:var(--accent2);border-color:var(--accent);background:rgba(255,105,0,.1)}
.connectBtn{width:100%;margin-top:14px;padding:16px;border-radius:16px;font-size:16px;font-weight:800;letter-spacing:.3px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 24px rgba(255,105,0,.35)}
.note{display:flex;gap:10px;color:var(--muted);font-size:13px;margin:12px 2px 0;line-height:1.5}
.note:before{content:"i";flex:none;width:20px;height:20px;border-radius:50%;background:var(--card2);border:1px solid var(--line);color:var(--accent2);font-weight:800;font-size:12px;display:grid;place-items:center;margin-top:1px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px}
.sec b{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.badge{font-weight:800;font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--card2)}
.badge.unlocked{color:var(--ok);border-color:rgba(52,210,123,.4);background:rgba(52,210,123,.08)}
.badge.locked{color:var(--bad);border-color:rgba(255,90,82,.4);background:rgba(255,90,82,.08)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card2);cursor:pointer;min-width:0;animation:up .35s both}
.tile:active{border-color:var(--accent)}
.tile small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px}
.tile b{font-size:15px;word-break:break-word;font-weight:700}
.tile:first-child:nth-last-child(odd),.tile:last-child:nth-child(odd){grid-column:1/-1}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.slotCard .sec{margin-bottom:10px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slots button{padding:18px 8px;border-radius:16px;font-size:16px;font-weight:800;letter-spacing:.5px;background:var(--card2);border:1px solid var(--line)}
.slots button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 6px 20px rgba(255,105,0,.35)}
.slots button.warn-btn{color:var(--bad);border-color:rgba(255,90,82,.4)}
.slots button.warn-btn:active:not(:disabled){background:rgba(255,90,82,.12)}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .ph{width:54px;height:90px;margin:0 auto 14px;border:3px solid var(--line);border-radius:14px;position:relative}
.empty .ph:after{content:"";position:absolute;left:50%;bottom:7px;width:14px;height:3px;margin-left:-7px;border-radius:3px;background:var(--accent)}
.empty b{display:block;color:var(--text);margin-bottom:4px}
.dock{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:10px}
.dock button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:11px;font-weight:700}
.dock button i{font-style:normal;font-size:18px;line-height:1}
.dock button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}
.dock button.warn{color:var(--accent2)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#fff;color:#111;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Y</div>
    <div class="ttl"><h1>FIXWITH<span>YUVI</span></h1><small>Android ToolKit</small></div>
    <span id="state" class="pill">Offline</span>
  </header>

  <div class="card">
    <div class="seg">
      <button id="mainXiaomi" class="tab on">Xiaomi / POCO</button>
      <button id="mainVivo" class="tab">Vivo</button>
      <button id="mainSamsung" class="tab">Samsung</button>
    </div>
    <div class="sub-tabs" id="xiaomiSubTabs">
      <button id="tabFb" class="subtab on">Fastboot Mode</button>
      <button id="tabMa" class="subtab">Mi Assistant</button>
    </div>
    <button id="btnConnect" class="connectBtn">Connect device</button>
    <div class="dock">
  <button id="btnRead" class="primary" disabled><i>&#8635;</i>Read</button>
  <button id="btnCopy" disabled><i>&#10063;</i>Copy</button>
  <button id="btnSave" disabled><i>&#8681;</i>Save</button>
  <button id="btnReboot" class="warn" disabled><i>&#9211;</i>Reboot</button>
  <button id="btnRebootBl" class="warn" disabled><i>&#9881;</i>Boot&shy;loader</button>
</div>
    <p class="note" id="note">Put the Xiaomi/POCO phone in Fastboot mode (Power + Volume Down), connect USB, then tap Connect device.</p>
  </div>

  <div class="card slotCard" id="slotCard">
    <div class="sec"><b>Boot Slot</b></div>
    <div class="slots">
      <button id="btnSlotA" disabled>SLOT A</button>
      <button id="btnSlotB" disabled>SLOT B</button>
    </div>
  </div>

  <div class="card slotCard" id="fbCmdCard">
    <div class="sec"><b>Fastboot Commands</b></div>
    <div class="slots">
      <button id="btnEraseConfig" class="warn-btn" disabled>ERASE</button>
    </div>
  </div>

  <div class="card empty" id="empty">
    <div class="ph"></div>
    <b>No device info yet</b>
    Connect a phone to read its details instantly.
  </div>

  <div class="card" id="summaryCard" hidden>
    <div class="sec"><b>Device info</b><span id="badge" class="badge">Bootloader: ?</span></div>
    <div class="grid" id="summary"></div>
    <p class="hint">Tap any tile to copy its value</p>
  </div>
</div>

<div id="toast"></div>
